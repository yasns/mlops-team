apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
  namespace: mlops-team
  labels:
    app: inference
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inference
  template:
    metadata:
      labels:
        app: inference
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: ghcr.io/yasns/mlops-team:sha-24df67d # local build until the first CD run bumps it
          envFrom:
            - secretRef:
                name: mlflow-credentials # MLFLOW_TRACKING_URI
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: inference
  namespace: mlops-team
  labels:
    app: inference
spec:
  selector:
    app: inference
  ports:
    - port: 80
      targetPort: 8000
